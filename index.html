<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#171a2e">
<title>Dino's Chemistry</title>
<style>
:root{--ink:#222437;--pink:#f287a0;--cream:#fff5e7;--glass:rgba(255,255,255,.78)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101426;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:grid;place-items:center}
#app{position:relative;width:min(100vw,520px);height:100dvh;overflow:hidden;background:#171a2e;isolation:isolate}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;z-index:8;left:14px;right:14px;top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;opacity:0;transform:translateY(-8px);transition:.3s ease;pointer-events:none}
#hud.show{opacity:1;transform:none}
.pill{height:39px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.82);box-shadow:0 7px 22px rgba(0,0,0,.12);backdrop-filter:blur(14px);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--ink);white-space:nowrap}
#position{min-width:59px;justify-content:center}
.trackbar{height:39px;flex:1;padding:0 10px;display:flex;align-items:center;border-radius:999px;background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.78);backdrop-filter:blur(14px)}
.trackline{position:relative;width:100%;height:5px;border-radius:999px;background:rgba(34,36,55,.13)}
.trackfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,#f287a0,#d85f82)}
.rivaldot,.playerdot{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);transition:left .12s linear}
.rivaldot{background:#666b78;opacity:.65}
.playerdot{width:10px;height:10px;background:#e75e80;border:2px solid white;box-shadow:0 1px 6px rgba(0,0,0,.25)}
#sound{pointer-events:auto;width:39px;padding:0;justify-content:center;border:0}
#power{position:absolute;z-index:8;top:calc(max(12px,env(safe-area-inset-top)) + 49px);left:50%;transform:translateX(-50%) translateY(-8px);min-width:0;opacity:0;transition:.22s ease;pointer-events:none}
#power.show{opacity:1;transform:translateX(-50%) translateY(0)}
#zone{position:absolute;z-index:6;top:94px;left:0;right:0;text-align:center;color:white;font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.35);opacity:0;transform:translateY(8px);transition:.45s ease;pointer-events:none}
#zone.show{opacity:1;transform:none}
#toast{position:absolute;z-index:9;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,14px);width:min(calc(100% - 38px),360px);padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 34px rgba(0,0,0,.16);backdrop-filter:blur(14px);font-size:13px;font-weight:850;line-height:1.35;text-align:center;color:var(--ink);opacity:0;transition:.3s ease;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#controlHint{position:absolute;z-index:7;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 15px;border-radius:999px;background:rgba(255,255,255,.78);font-size:12px;font-weight:850;color:#575a67;box-shadow:0 7px 22px rgba(0,0,0,.12);transition:.3s ease;pointer-events:none;white-space:nowrap}
#controlHint.hide{opacity:0}
.screen{position:absolute;z-index:12;inset:0;display:grid;place-items:center;padding:26px;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.22),transparent 32%),linear-gradient(180deg,rgba(23,26,46,.1),rgba(23,26,46,.62));transition:.42s ease}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.card{width:min(100%,380px);padding:28px 23px 23px;text-align:center;border-radius:32px;background:rgba(255,250,246,.91);border:1px solid rgba(255,255,255,.8);box-shadow:0 24px 75px rgba(0,0,0,.24);backdrop-filter:blur(18px)}
.logo{width:108px;height:86px;margin:0 auto;position:relative}
.logo .car{position:absolute;left:13px;bottom:5px;width:82px;height:38px;border-radius:18px 25px 13px 13px;background:#e76f88;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.logo .cab{position:absolute;left:31px;bottom:34px;width:42px;height:28px;border-radius:24px 25px 5px 5px;background:#f294a7}
.logo .head{position:absolute;left:44px;bottom:45px;width:27px;height:26px;border-radius:55% 48% 47% 45%;background:#6e9f78}
.logo .eye{position:absolute;left:61px;bottom:61px;width:4px;height:4px;border-radius:50%;background:#232535}
.logo .wheel{position:absolute;bottom:0;width:18px;height:18px;border-radius:50%;background:#292b37;border:4px solid #4f5362}
.logo .w1{left:23px}.logo .w2{right:18px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#fff0f4;color:#bd5871;font-size:11px;font-weight:950;letter-spacing:.09em;text-transform:uppercase}
h1{margin:16px 0 8px;font-size:clamp(34px,10vw,46px);line-height:.98;letter-spacing:-.05em;color:#26283a}
.copy{margin:0 auto;max-width:300px;font-size:14px;line-height:1.55;color:#696b76}
.primary{width:100%;margin-top:24px;border:0;border-radius:18px;padding:16px 20px;background:linear-gradient(180deg,#f287a0,#dd6e89);box-shadow:0 12px 26px rgba(221,110,137,.3);color:white;font:inherit;font-size:16px;font-weight:950}
.micro{margin:12px 0 0;font-size:11px;color:#8c8d95}
.result{margin:16px 0 3px;font-size:44px;font-weight:950;letter-spacing:-.05em;color:#282a3b}
.resultCopy{margin:0 auto;max-width:290px;font-size:15px;line-height:1.5;color:#656773}
.chemistry{margin:15px auto 0;display:inline-block;padding:9px 13px;border-radius:13px;background:#fff0f4;color:#b9506b;font-size:13px;font-weight:950}
@media (min-width:700px){#app{height:min(94dvh,900px);border-radius:36px;box-shadow:0 35px 90px rgba(0,0,0,.36)}}
</style>
</head>
<body>
<main id="app">
<canvas id="game"></canvas>

<div id="hud">
  <div class="pill" id="position">4 / 4</div>
  <div class="trackbar">
    <div class="trackline">
      <div class="trackfill" id="trackFill"></div>
      <span class="rivaldot" id="r1"></span>
      <span class="rivaldot" id="r2"></span>
      <span class="rivaldot" id="r3"></span>
      <span class="playerdot" id="me"></span>
    </div>
  </div>
  <button class="pill" id="sound" aria-label="Toggle sound">♪</button>
</div>

<div class="pill" id="power"></div>
<div id="zone"></div>
<div id="toast"></div>
<div id="controlHint">Drag left and right to steer</div>

<section class="screen" id="start">
  <div class="card">
    <div class="logo">
      <div class="car"></div><div class="cab"></div><div class="head"></div><div class="eye"></div>
      <div class="wheel w1"></div><div class="wheel w2"></div>
    </div>
    <div class="eyebrow">One tiny race</div>
    <h1>Dino's<br>Chemistry</h1>
    <p class="copy">Race three dinos to the finish. Collect elements, trigger reactions and use them to get ahead.</p>
    <button class="primary" id="startBtn">Start race</button>
    <p class="micro">Portrait mode · Drag anywhere to steer</p>
  </div>
</section>

<section class="screen hidden" id="end">
  <div class="card">
    <div class="eyebrow">Race complete</div>
    <div class="result" id="resultPlace">1st</div>
    <p class="resultCopy" id="resultCopy">That was quick.</p>
    <div class="chemistry">Dino + You = perfect chemistry ♡</div>
    <button class="primary" id="againBtn">Race again</button>
  </div>
</section>
</main>

<script>
(function(){
'use strict';
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var app=document.getElementById('app');
var startScreen=document.getElementById('start');
var endScreen=document.getElementById('end');
var hud=document.getElementById('hud');
var positionEl=document.getElementById('position');
var trackFill=document.getElementById('trackFill');
var meDot=document.getElementById('me');
var rivalDots=[document.getElementById('r1'),document.getElementById('r2'),document.getElementById('r3')];
var powerEl=document.getElementById('power');
var toast=document.getElementById('toast');
var zoneEl=document.getElementById('zone');
var hint=document.getElementById('controlHint');
var soundBtn=document.getElementById('sound');
var resultPlace=document.getElementById('resultPlace');
var resultCopy=document.getElementById('resultCopy');

var VW=390,VH=844,FINISH=10500;
var dpr=1,last=0,playing=false,finished=false,muted=false,audioCtx=null;
var roadTime=0,shake=0,toastTimer=0,zoneTimer=0;
var pointerDown=false,pointerX=195;

var player={x:0.5,targetX:0.5,progress:0,speed:132,baseSpeed:132,boost:0,shield:0,hover:0,neon:0,hitFlash:0};
var rivals=[
  {x:.26,progress:120,speed:134,color:'#f0b25c',accent:'#f8d7a6',seed:.4},
  {x:.66,progress:70,speed:136,color:'#78a8d7',accent:'#bad4ec',seed:1.7},
  {x:.47,progress:20,speed:131,color:'#9b7ac8',accent:'#ccb9e8',seed:2.8}
];
var pickups=[],hazards=[],sparks=[];
var currentZone=-1;

var zones=[
  {name:'Garden Grid',sky1:'#bde3db',sky2:'#f7e8bf',road:'#565b68',edge:'#f2ead8',ground:'#8ebc83'},
  {name:'Lab Loop',sky1:'#8ed1d2',sky2:'#d7e4eb',road:'#4c5264',edge:'#d8f0ef',ground:'#72a5a2'},
  {name:'Sunset Circuit',sky1:'#f3a98d',sky2:'#d889a6',road:'#554b62',edge:'#f8ddc4',ground:'#a86d78'},
  {name:'Neon Night',sky1:'#202845',sky2:'#563b67',road:'#2d3044',edge:'#d7c5f1',ground:'#292f49'}
];

var elements=[
  {symbol:'O',name:'Oxygen boost',kind:'boost',color:'#7cc9e8'},
  {symbol:'C',name:'Carbon shield',kind:'shield',color:'#73808b'},
  {symbol:'He',name:'Helium hover',kind:'hover',color:'#f3c36d'},
  {symbol:'Ne',name:'Neon rush',kind:'neon',color:'#f177b5'},
  {symbol:'Au',name:'Gold boost',kind:'boost',color:'#efc65d'}
];

function resize(){
  var r=canvas.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(r.width*dpr);
  canvas.height=Math.round(r.height*dpr);
}
window.addEventListener('resize',resize,{passive:true});resize();
function sx(){return canvas.width/dpr/VW}
function sy(){return canvas.height/dpr/VH}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function roadCurveAt(p){
  return Math.sin(p/570)*54+Math.sin(p/1170+1.6)*31+Math.sin(p/2550)*20;
}
function zoneIndex(p){return Math.min(3,Math.floor(p/(FINISH/4)))}
function placeSuffix(n){return n===1?'1st':n===2?'2nd':n===3?'3rd':'4th'}

function sound(freq,dur,type,vol){
  if(muted)return;
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||.03,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
    o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function vibrate(ms){if(navigator.vibrate)navigator.vibrate(ms)}
function showToast(text){
  clearTimeout(toastTimer);toast.textContent=text;toast.classList.add('show');
  toastTimer=setTimeout(function(){toast.classList.remove('show')},1800);
}
function showZone(name){
  clearTimeout(zoneTimer);zoneEl.textContent=name;zoneEl.classList.add('show');
  zoneTimer=setTimeout(function(){zoneEl.classList.remove('show')},1500);
}
function setPower(text){
  if(!text){powerEl.classList.remove('show');return}
  powerEl.textContent=text;powerEl.classList.add('show');
}

function buildTrack(){
  pickups=[];hazards=[];sparks=[];
  var p=600,idx=0;
  while(p<FINISH-500){
    p+=430+((idx*137)%240);
    var elem=elements[idx%elements.length];
    pickups.push({progress:p,lane:.18+((idx*37)%64)/100,element:elem,got:false,bob:idx*.8});
    if(idx%2===0)hazards.push({progress:p+210,lane:.18+((idx*53)%64)/100,type:idx%4===0?'oil':'cone',hit:false});
    idx++;
  }
}
function reset(){
  player.x=.5;player.targetX=.5;player.progress=0;player.speed=132;player.baseSpeed=132;
  player.boost=0;player.shield=0;player.hover=0;player.neon=0;player.hitFlash=0;
  rivals[0].progress=120;rivals[1].progress=70;rivals[2].progress=20;
  rivals[0].speed=134;rivals[1].speed=136;rivals[2].speed=131;
  finished=false;playing=false;roadTime=0;shake=0;currentZone=-1;
  buildTrack();updateHud();
}

function roadGeom(y){
  var horizon=178;
  var t=clamp((y-horizon)/(VH-horizon),0,1);
  var z=t*t;
  var half=lerp(28,218,z);
  var ahead=(1-t)*1650;
  var center=VW/2+roadCurveAt(player.progress+ahead)*lerp(.25,1,t);
  return {t:t,z:z,half:half,center:center};
}
function project(progress,lane){
  var d=progress-player.progress;
  if(d<-80||d>1750)return null;
  var q=1-clamp(d/1750,0,1);
  var y=178+Math.pow(q,1.85)*(VH-178);
  var g=roadGeom(y);
  return {x:g.center+(lane-.5)*g.half*1.72,y:y,scale:.25+g.z*.95,z:g.z};
}

function updateHud(){
  var all=[player.progress,rivals[0].progress,rivals[1].progress,rivals[2].progress].slice().sort(function(a,b){return b-a});
  var place=all.indexOf(player.progress)+1;
  positionEl.textContent=place+' / 4';
  var pct=clamp(player.progress/FINISH*100,0,100);
  trackFill.style.width=pct+'%';meDot.style.left=pct+'%';
  for(var i=0;i<3;i++)rivalDots[i].style.left=clamp(rivals[i].progress/FINISH*100,0,100)+'%';
}
function getPlace(){
  var ahead=0;
  for(var i=0;i<rivals.length;i++)if(rivals[i].progress>player.progress)ahead++;
  return ahead+1;
}

function activate(elem){
  if(elem.kind==='boost'){player.boost=2.6;showToast(elem.name+' · speed up');setPower(elem.symbol+'  BOOST')}
  if(elem.kind==='shield'){player.shield=5.2;showToast(elem.name+' · protected');setPower(elem.symbol+'  SHIELD')}
  if(elem.kind==='hover'){player.hover=4.1;showToast(elem.name+' · hazards ignored');setPower(elem.symbol+'  HOVER')}
  if(elem.kind==='neon'){player.neon=3.8;player.boost=3.0;showToast(elem.name+' · full reaction');setPower(elem.symbol+'  RUSH')}
  sound(650,.07,'sine',.035);setTimeout(function(){sound(830,.08,'sine',.026)},60);vibrate(18);
}
function collide(){
  if(player.hover>0)return;
  if(player.shield>0){
    player.shield=Math.max(0,player.shield-1.1);
    sound(310,.09,'triangle',.025);showToast('Carbon took the hit');shake=.18;return;
  }
  player.speed=Math.max(86,player.speed-35);player.hitFlash=.55;shake=.32;
  sound(115,.11,'sawtooth',.028);vibrate(34);showToast('Tiny collision · keep racing');
}

function update(dt){
  if(!playing)return;
  roadTime+=dt;
  player.x=lerp(player.x,player.targetX,1-Math.pow(.0008,dt));
  player.x=clamp(player.x,.08,.92);

  player.boost=Math.max(0,player.boost-dt);player.shield=Math.max(0,player.shield-dt);
  player.hover=Math.max(0,player.hover-dt);player.neon=Math.max(0,player.neon-dt);player.hitFlash=Math.max(0,player.hitFlash-dt);
  shake=Math.max(0,shake-dt);

  var target=player.baseSpeed+(player.boost>0?54:0)+(player.neon>0?20:0);
  player.speed=lerp(player.speed,target,1-Math.pow(.06,dt));
  player.progress+=player.speed*dt;

  for(var i=0;i<rivals.length;i++){
    var r=rivals[i];
    var wobble=Math.sin(roadTime*.85+r.seed)*5+Math.sin(r.progress/660+r.seed)*3;
    r.progress+=(r.speed+wobble)*dt;
    r.x=clamp(r.x+Math.sin(roadTime*.5+r.seed)*dt*.025,.16,.84);
  }

  for(var j=0;j<pickups.length;j++){
    var p=pickups[j];if(p.got)continue;
    var diff=p.progress-player.progress;
    if(Math.abs(diff)<55&&Math.abs(p.lane-player.x)<.115){
      p.got=true;activate(p.element);burst(p.lane,18,p.element.color);
    }
  }
  for(var k=0;k<hazards.length;k++){
    var h=hazards[k];if(h.hit)continue;
    var hd=h.progress-player.progress;
    if(Math.abs(hd)<42&&Math.abs(h.lane-player.x)<.115){
      h.hit=true;collide();
    }
  }

  var zi=zoneIndex(player.progress);
  if(zi!==currentZone&&zi<4){currentZone=zi;showZone(zones[zi].name)}
  if(player.boost<=0&&player.shield<=0&&player.hover<=0&&player.neon<=0)setPower('');
  updateSparks(dt);updateHud();
  if(player.progress>=FINISH)finishRace();
}

function burst(lane,count,color){
  for(var i=0;i<count;i++)sparks.push({lane:lane,xOff:(Math.random()-.5)*22,yOff:0,vx:(Math.random()-.5)*65,vy:-45-Math.random()*90,age:0,life:.5+Math.random()*.45,size:2+Math.random()*3,color:color});
}
function updateSparks(dt){
  for(var i=sparks.length-1;i>=0;i--){
    var s=sparks[i];s.age+=dt;s.xOff+=s.vx*dt;s.yOff+=s.vy*dt;s.vy+=145*dt;
    if(s.age>s.life)sparks.splice(i,1);
  }
}

function finishRace(){
  if(finished)return;
  finished=true;playing=false;hud.classList.remove('show');hint.classList.add('hide');setPower('');
  var place=getPlace(),suffix=placeSuffix(place);
  resultPlace.textContent=suffix;
  if(place===1)resultCopy.textContent='Fastest dino on the road. The chemistry definitely worked.';
  else if(place===2)resultCopy.textContent='Very close. Good chemistry, questionable cornering.';
  else if(place===3)resultCopy.textContent='Podium-ish. More importantly, the reaction was successful.';
  else resultCopy.textContent='The other dinos were suspiciously fast. The chemistry still checks out.';
  sound(523,.13,'sine',.035);setTimeout(function(){sound(659,.15,'sine',.035)},100);setTimeout(function(){sound(784,.26,'sine',.035)},220);
  setTimeout(function(){endScreen.classList.remove('hidden')},650);
}

function rounded(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawSky(z){
  var gr=ctx.createLinearGradient(0,0,0,VH);
  gr.addColorStop(0,z.sky1);gr.addColorStop(1,z.sky2);ctx.fillStyle=gr;ctx.fillRect(0,0,VW,VH);
  if(currentZone===3){
    for(var i=0;i<28;i++){
      var a=.35+.5*(.5+.5*Math.sin(roadTime*1.7+i));
      ctx.fillStyle='rgba(255,245,220,'+a+')';ctx.beginPath();ctx.arc((i*67)%VW,62+(i*103)%285,i%5===0?1.8:1,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='rgba(255,241,201,.9)';ctx.beginPath();ctx.arc(320,115,25,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='rgba(255,248,215,.7)';ctx.beginPath();ctx.arc(315,117,34,0,Math.PI*2);ctx.fill();
  }
}
function drawScenery(z){
  var horizon=178;
  ctx.fillStyle=z.ground;ctx.fillRect(0,horizon,VW,VH-horizon);
  for(var band=0;band<4;band++){
    var by=205+band*38;
    ctx.fillStyle=currentZone===3?'rgba(25,30,52,'+(0.2+band*.08)+')':'rgba(70,105,88,'+(0.12+band*.05)+')';
    ctx.beginPath();ctx.moveTo(0,by+35);
    for(var x=0;x<=VW;x+=60)ctx.lineTo(x,by+Math.sin((x+roadTime*12+band*41)/55)*17);
    ctx.lineTo(VW,by+65);ctx.lineTo(0,by+65);ctx.closePath();ctx.fill();
  }
}
function drawRoad(z){
  var horizon=178;
  var slices=55;
  for(var i=0;i<slices;i++){
    var y1=horizon+(VH-horizon)*i/slices;
    var y2=horizon+(VH-horizon)*(i+1)/slices;
    var g1=roadGeom(y1),g2=roadGeom(y2);
    ctx.fillStyle=(Math.floor((player.progress/70)+i/4)%2===0)?z.road:shade(z.road,-7);
    ctx.beginPath();ctx.moveTo(g1.center-g1.half,y1);ctx.lineTo(g1.center+g1.half,y1);ctx.lineTo(g2.center+g2.half,y2);ctx.lineTo(g2.center-g2.half,y2);ctx.closePath();ctx.fill();

    var edgeW1=lerp(2,16,g1.z),edgeW2=lerp(2,16,g2.z);
    var stripe=(Math.floor((player.progress/38)+i/3)%2===0);
    ctx.fillStyle=stripe?z.edge:'#c86472';
    ctx.beginPath();ctx.moveTo(g1.center-g1.half-edgeW1,y1);ctx.lineTo(g1.center-g1.half,y1);ctx.lineTo(g2.center-g2.half,y2);ctx.lineTo(g2.center-g2.half-edgeW2,y2);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(g1.center+g1.half,y1);ctx.lineTo(g1.center+g1.half+edgeW1,y1);ctx.lineTo(g2.center+g2.half+edgeW2,y2);ctx.lineTo(g2.center+g2.half,y2);ctx.closePath();ctx.fill();

    if(i%3===0){
      ctx.strokeStyle='rgba(255,255,255,.62)';ctx.lineWidth=lerp(.5,4,g1.z);
      for(var lane=1;lane<=2;lane++){
        var lx1=g1.center-g1.half+g1.half*2*(lane/3);
        var lx2=g2.center-g2.half+g2.half*2*(lane/3);
        ctx.beginPath();ctx.moveTo(lx1,y1);ctx.lineTo(lx2,y2);ctx.stroke();
      }
    }
  }
}
function shade(hex,amt){
  var n=parseInt(hex.slice(1),16),r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  return '#'+(0x1000000+(clamp(r,0,255)<<16)+(clamp(g,0,255)<<8)+clamp(b,0,255)).toString(16).slice(1);
}
function drawCar(x,y,scale,color,accent,dinoColor,flip){
  ctx.save();ctx.translate(x,y);ctx.scale(scale*(flip?-1:1),scale);
  if(player.neon>0&&color==='#e76f88'){ctx.shadowColor='#ff79c7';ctx.shadowBlur=24}
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,20,31,10,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#242735';ctx.beginPath();ctx.arc(-23,14,9,0,Math.PI*2);ctx.arc(23,14,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=color;rounded(-34,-10,68,31,11);ctx.fill();
  ctx.fillStyle=accent;rounded(-20,-25,41,20,10);ctx.fill();
  ctx.fillStyle='rgba(225,247,252,.8)';rounded(-12,-22,25,12,6);ctx.fill();
  ctx.fillStyle=dinoColor;ctx.beginPath();ctx.arc(2,-28,12,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(-7,-26);ctx.lineTo(-18,-21);ctx.lineTo(-6,-18);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f5f0da';ctx.beginPath();ctx.arc(7,-31,2.7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#252735';ctx.beginPath();ctx.arc(8,-31,1.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff0a8';ctx.fillRect(26,-2,8,5);
  ctx.restore();
}
function drawPickup(p){
  if(p.got)return;var pr=project(p.progress,p.lane);if(!pr)return;
  var yy=pr.y+Math.sin(roadTime*4+p.bob)*6*pr.scale;
  ctx.save();ctx.translate(pr.x,yy);ctx.scale(pr.scale,pr.scale);
  ctx.shadowColor=p.element.color;ctx.shadowBlur=18;
  ctx.fillStyle='rgba(255,255,255,.94)';ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle=p.element.color;ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,0,26,7,0,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,0,26,7,Math.PI/3,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#2b2d3d';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.element.symbol,0,0);
  ctx.restore();
}
function drawHazard(h){
  if(h.hit)return;var pr=project(h.progress,h.lane);if(!pr)return;
  ctx.save();ctx.translate(pr.x,pr.y);ctx.scale(pr.scale,pr.scale);
  if(h.type==='cone'){
    ctx.fillStyle='#ef804b';ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(-14,10);ctx.lineTo(14,10);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff7df';ctx.fillRect(-9,-7,18,6);ctx.fillStyle='#393b45';ctx.fillRect(-18,9,36,6);
  }else{
    ctx.fillStyle='rgba(28,31,39,.84)';ctx.beginPath();ctx.ellipse(0,6,25,11,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.14)';ctx.beginPath();ctx.ellipse(-6,3,8,3,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function drawFinish(){
  var pr=project(FINISH,.5);if(!pr)return;
  var g=roadGeom(pr.y),w=g.half*1.7;
  ctx.save();ctx.translate(pr.x,pr.y);ctx.scale(1,Math.max(.22,pr.scale));
  var cells=10,cell=w*2/cells;
  for(var i=0;i<cells;i++){
    ctx.fillStyle=i%2===0?'#ffffff':'#202230';ctx.fillRect(-w+i*cell,-5,cell,10);
  }
  ctx.restore();
}
function drawRivals(){
  var arr=rivals.slice().sort(function(a,b){return b.progress-a.progress});
  for(var i=0;i<arr.length;i++){
    var r=arr[i],pr=project(r.progress,r.x);if(!pr)continue;
    drawCar(pr.x,pr.y-18*pr.scale,pr.scale*.82,r.color,r.accent,'#709d78',false);
  }
}
function drawPlayer(){
  var y=720+(player.hover>0?Math.sin(roadTime*6)*6-16:0);
  var g=roadGeom(y),x=g.center+(player.x-.5)*g.half*1.72;
  if(shake>0){x+=(Math.random()-.5)*10*shake/.32;y+=(Math.random()-.5)*7*shake/.32}
  if(player.boost>0){
    ctx.strokeStyle='rgba(255,236,181,.7)';ctx.lineWidth=3;
    for(var i=0;i<7;i++){var ox=(Math.random()-.5)*52;ctx.beginPath();ctx.moveTo(x+ox,y+27);ctx.lineTo(x+ox,y+48+Math.random()*18);ctx.stroke()}
  }
  if(player.shield>0){
    ctx.strokeStyle='rgba(136,220,231,.72)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,48,54,0,0,Math.PI*2);ctx.stroke();
  }
  var alpha=player.hitFlash>0&&Math.floor(roadTime*18)%2===0?.45:1;ctx.globalAlpha=alpha;
  drawCar(x,y,1.06,'#e76f88','#f4a2b2','#6e9f78',false);ctx.globalAlpha=1;
}
function drawSparks(){
  var base=project(player.progress+14,player.x);if(!base)return;
  for(var i=0;i<sparks.length;i++){
    var s=sparks[i],a=1-s.age/s.life;ctx.globalAlpha=a;ctx.fillStyle=s.color;
    ctx.beginPath();ctx.arc(base.x+s.xOff,base.y-30+s.yOff,s.size,0,Math.PI*2);ctx.fill();
  }ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(dpr*sx(),0,0,dpr*sy(),0,0);
  var zi=zoneIndex(player.progress);var z=zones[Math.min(3,zi)];
  drawSky(z);drawScenery(z);drawRoad(z);drawFinish();
  var objects=[];
  for(var i=0;i<pickups.length;i++)objects.push({p:pickups[i].progress,type:'p',o:pickups[i]});
  for(var j=0;j<hazards.length;j++)objects.push({p:hazards[j].progress,type:'h',o:hazards[j]});
  objects.sort(function(a,b){return b.p-a.p});
  for(var k=0;k<objects.length;k++){if(objects[k].type==='p')drawPickup(objects[k].o);else drawHazard(objects[k].o)}
  drawRivals();drawPlayer();drawSparks();
}

function frame(t){
  var dt=Math.min(.032,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame);
}
function startRace(){
  reset();playing=true;startScreen.classList.add('hidden');endScreen.classList.add('hidden');hud.classList.add('show');hint.classList.remove('hide');showZone(zones[0].name);
  sound(330,.06,'square',.025);setTimeout(function(){sound(440,.06,'square',.025)},100);setTimeout(function(){sound(660,.1,'square',.03)},220);
  setTimeout(function(){hint.classList.add('hide')},2500);
}
function pointerToX(e){
  var r=canvas.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width,0,1);
}
app.addEventListener('pointerdown',function(e){
  if(e.target.tagName==='BUTTON')return;
  pointerDown=true;pointerX=pointerToX(e);player.targetX=pointerX;
});
app.addEventListener('pointermove',function(e){if(!pointerDown||!playing)return;pointerX=pointerToX(e);player.targetX=pointerX});
window.addEventListener('pointerup',function(){pointerDown=false});
document.getElementById('startBtn').addEventListener('click',function(e){e.stopPropagation();startRace()});
document.getElementById('againBtn').addEventListener('click',function(e){e.stopPropagation();endScreen.classList.add('hidden');startRace()});
soundBtn.addEventListener('click',function(e){e.stopPropagation();muted=!muted;soundBtn.textContent=muted?'×':'♪'});
document.addEventListener('visibilitychange',function(){if(document.hidden)last=performance.now()});

reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
