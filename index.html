<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1f2940">
<title>Dino's Chemistry</title>
<style>
:root{--ink:#25283a;--pink:#eb7891;--cream:#fff7ed;--glass:rgba(255,255,255,.82)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121828;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{display:grid;place-items:center}
#app{position:relative;width:min(100vw,520px);height:100dvh;overflow:hidden;background:#1f2940;isolation:isolate}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;z-index:8;left:14px;right:14px;top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;opacity:0;transform:translateY(-8px);transition:.28s ease;pointer-events:none}
#hud.show{opacity:1;transform:none}
.pill{height:39px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.83);border:1px solid rgba(255,255,255,.78);box-shadow:0 7px 22px rgba(0,0,0,.12);backdrop-filter:blur(14px);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--ink);white-space:nowrap}
#chemCount{min-width:62px;justify-content:center}
.trackbar{height:39px;flex:1;padding:0 10px;display:flex;align-items:center;border-radius:999px;background:rgba(255,255,255,.77);border:1px solid rgba(255,255,255,.78);backdrop-filter:blur(14px)}
.trackline{position:relative;width:100%;height:6px;border-radius:999px;background:rgba(34,36,55,.13);overflow:hidden}
.trackfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,#f08aa0,#dc6685)}
#sound{pointer-events:auto;width:39px;padding:0;justify-content:center;border:0}
#power{position:absolute;z-index:8;top:calc(max(12px,env(safe-area-inset-top)) + 49px);left:50%;transform:translateX(-50%) translateY(-8px);min-width:0;opacity:0;transition:.22s ease;pointer-events:none}
#power.show{opacity:1;transform:translateX(-50%) translateY(0)}
#zone{position:absolute;z-index:6;top:96px;left:0;right:0;text-align:center;color:white;font-size:12px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.35);opacity:0;transform:translateY(8px);transition:.45s ease;pointer-events:none}
#zone.show{opacity:1;transform:none}
#toast{position:absolute;z-index:9;left:50%;bottom:calc(118px + env(safe-area-inset-bottom));transform:translate(-50%,14px);width:min(calc(100% - 38px),360px);padding:11px 15px;border-radius:17px;background:rgba(255,255,255,.91);border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 34px rgba(0,0,0,.16);backdrop-filter:blur(14px);font-size:13px;font-weight:850;line-height:1.35;text-align:center;color:var(--ink);opacity:0;transition:.3s ease;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#controls{position:absolute;z-index:10;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.22fr 1fr;gap:11px;opacity:0;transform:translateY(18px);transition:.28s ease;pointer-events:none}
#controls.show{opacity:1;transform:none;pointer-events:auto}
.ctrl{height:70px;border:1px solid rgba(255,255,255,.72);border-radius:22px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(0,0,0,.18);font:inherit;font-weight:950;color:#303344;font-size:24px;-webkit-tap-highlight-color:transparent}
.ctrl:active{transform:translateY(2px) scale(.98);background:rgba(255,255,255,.95)}
#jumpBtn{font-size:13px;letter-spacing:.12em;background:linear-gradient(180deg,rgba(244,139,160,.95),rgba(222,101,132,.95));color:white;border-color:rgba(255,255,255,.35)}
#jumpBtn span{display:block;font-size:22px;line-height:18px;margin-bottom:5px}
.screen{position:absolute;z-index:12;inset:0;display:grid;place-items:center;padding:26px;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.22),transparent 32%),linear-gradient(180deg,rgba(23,26,46,.1),rgba(23,26,46,.64));transition:.42s ease}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.card{width:min(100%,380px);padding:28px 23px 23px;text-align:center;border-radius:32px;background:rgba(255,250,246,.92);border:1px solid rgba(255,255,255,.8);box-shadow:0 24px 75px rgba(0,0,0,.24);backdrop-filter:blur(18px)}
.logo{width:108px;height:86px;margin:0 auto;position:relative}
.logo .car{position:absolute;left:13px;bottom:5px;width:82px;height:38px;border-radius:18px 25px 13px 13px;background:#e76f88;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.logo .cab{position:absolute;left:31px;bottom:34px;width:42px;height:28px;border-radius:24px 25px 5px 5px;background:#f294a7}
.logo .head{position:absolute;left:44px;bottom:45px;width:27px;height:26px;border-radius:55% 48% 47% 45%;background:#6e9f78}
.logo .eye{position:absolute;left:61px;bottom:61px;width:4px;height:4px;border-radius:50%;background:#232535}
.logo .wheel{position:absolute;bottom:0;width:18px;height:18px;border-radius:50%;background:#292b37;border:4px solid #4f5362}
.logo .w1{left:23px}.logo .w2{right:18px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#fff0f4;color:#bd5871;font-size:11px;font-weight:950;letter-spacing:.09em;text-transform:uppercase}
h1{margin:16px 0 8px;font-size:clamp(34px,10vw,46px);line-height:.98;letter-spacing:-.05em;color:#26283a}
.copy{margin:0 auto;max-width:304px;font-size:14px;line-height:1.55;color:#696b76}
.primary{width:100%;margin-top:24px;border:0;border-radius:18px;padding:16px 20px;background:linear-gradient(180deg,#f287a0,#dd6e89);box-shadow:0 12px 26px rgba(221,110,137,.3);color:white;font:inherit;font-size:16px;font-weight:950}
.micro{margin:12px 0 0;font-size:11px;color:#8c8d95}
.result{margin:16px 0 3px;font-size:40px;font-weight:950;letter-spacing:-.05em;color:#282a3b}
.resultCopy{margin:0 auto;max-width:292px;font-size:15px;line-height:1.5;color:#656773}
.chemistry{margin:15px auto 0;display:inline-block;padding:9px 13px;border-radius:13px;background:#fff0f4;color:#b9506b;font-size:13px;font-weight:950}
@media (min-width:700px){#app{height:min(94dvh,900px);border-radius:36px;box-shadow:0 35px 90px rgba(0,0,0,.36)}}
</style>
</head>
<body>
<main id="app">
<canvas id="game"></canvas>

<div id="hud">
  <div class="pill" id="chemCount">⚗ 0</div>
  <div class="trackbar"><div class="trackline"><div class="trackfill" id="trackFill"></div></div></div>
  <button class="pill" id="sound" aria-label="Toggle sound">♪</button>
</div>

<div class="pill" id="power"></div>
<div id="zone"></div>
<div id="toast"></div>

<div id="controls">
  <button class="ctrl" id="leftBtn" aria-label="Move left">◀</button>
  <button class="ctrl" id="jumpBtn" aria-label="Jump"><span>↑</span>JUMP</button>
  <button class="ctrl" id="rightBtn" aria-label="Move right">▶</button>
</div>

<section class="screen" id="start">
  <div class="card">
    <div class="logo">
      <div class="car"></div><div class="cab"></div><div class="head"></div><div class="eye"></div>
      <div class="wheel w1"></div><div class="wheel w2"></div>
    </div>
    <div class="eyebrow">One dino · one road</div>
    <h1>Dino's<br>Chemistry</h1>
    <p class="copy">Switch lanes, jump the obstacles and collect chemistry capsules on the way to the finish.</p>
    <button class="primary" id="startBtn">Start drive</button>
    <p class="micro">Use Left · Jump · Right</p>
  </div>
</section>

<section class="screen hidden" id="end">
  <div class="card">
    <div class="eyebrow">Journey complete</div>
    <div class="result">Made it ♡</div>
    <p class="resultCopy" id="resultCopy">The road had a few reactions along the way.</p>
    <div class="chemistry">Dino + You = perfect chemistry ♡</div>
    <button class="primary" id="againBtn">Drive again</button>
  </div>
</section>
</main>

<script>
(function(){
'use strict';

var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var startScreen=document.getElementById('start');
var endScreen=document.getElementById('end');
var hud=document.getElementById('hud');
var controls=document.getElementById('controls');
var chemCount=document.getElementById('chemCount');
var trackFill=document.getElementById('trackFill');
var powerEl=document.getElementById('power');
var toast=document.getElementById('toast');
var zoneEl=document.getElementById('zone');
var soundBtn=document.getElementById('sound');
var resultCopy=document.getElementById('resultCopy');

var VW=390,VH=844,FINISH=11800;
var HORIZON=176;
var LANES=[.22,.5,.78];
var dpr=1,last=0,playing=false,finished=false,muted=false,audioCtx=null;
var roadTime=0,shake=0,toastTimer=0,zoneTimer=0,currentZone=-1;
var collected=0;
var pickups=[],hazards=[],particles=[];

var player={
  lane:1,x:.5,targetX:.5,progress:0,speed:137,baseSpeed:137,
  jumpY:0,jumpV:0,grounded:true,
  boost:0,shield:0,magnet:0,glow:0,hitFlash:0
};

var zones=[
  {name:'Garden Road',sky1:'#bfe4dc',sky2:'#f7e7c4',road:'#575d69',edge:'#f3ebd9',ground:'#8db980'},
  {name:'Chem Lab Pass',sky1:'#8bcfd0',sky2:'#d8e5eb',road:'#4e5565',edge:'#dbf1ef',ground:'#72a39f'},
  {name:'Sunset Bend',sky1:'#f3ac8f',sky2:'#d986a5',road:'#584c61',edge:'#f8ddc4',ground:'#a46e78'},
  {name:'Neon Night',sky1:'#212945',sky2:'#593c69',road:'#303346',edge:'#d9c6f0',ground:'#2b314a'}
];

var powers=[
  {symbol:'O',label:'Oxygen boost',kind:'boost',color:'#79c7e6'},
  {symbol:'C',label:'Carbon shield',kind:'shield',color:'#78838e'},
  {symbol:'Ne',label:'Neon glow',kind:'glow',color:'#ef77b4'},
  {symbol:'Fe',label:'Iron magnet',kind:'magnet',color:'#d3846f'}
];

function resize(){
  var r=canvas.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(r.width*dpr);
  canvas.height=Math.round(r.height*dpr);
}
window.addEventListener('resize',resize,{passive:true});resize();

function sx(){return canvas.width/dpr/VW}
function sy(){return canvas.height/dpr/VH}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}

function roadCurveAt(p){
  return Math.sin(p/620)*48+Math.sin(p/1400+1.3)*30+Math.sin(p/2900)*14;
}
function zoneIndex(p){return Math.min(3,Math.floor(p/(FINISH/4)))}

function sound(freq,dur,type,vol){
  if(muted)return;
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||.03,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
    o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function vibrate(ms){if(navigator.vibrate)navigator.vibrate(ms)}

function showToast(text){
  clearTimeout(toastTimer);toast.textContent=text;toast.classList.add('show');
  toastTimer=setTimeout(function(){toast.classList.remove('show')},1650);
}
function showZone(name){
  clearTimeout(zoneTimer);zoneEl.textContent=name;zoneEl.classList.add('show');
  zoneTimer=setTimeout(function(){zoneEl.classList.remove('show')},1450);
}
function setPower(text){
  if(!text){powerEl.classList.remove('show');return}
  powerEl.textContent=text;powerEl.classList.add('show');
}

function laneValue(index){return LANES[clamp(index,0,2)]}

function buildTrack(){
  pickups=[];hazards=[];particles=[];
  var cursor=520;
  var pattern=0;

  while(cursor<FINISH-550){
    cursor+=245+(pattern%4)*42;

    var laneA=(pattern*2+1)%3;
    var laneB=(laneA+1+(pattern%2))%3;
    var type=pattern%5;

    if(type===0){
      hazards.push({progress:cursor,lane:laneA,type:'cone',hit:false});
      hazards.push({progress:cursor+38,lane:(laneA+1)%3,type:'cone',hit:false});
      pickups.push({progress:cursor+155,lane:(laneA+2)%3,power:powers[pattern%powers.length],got:false,phase:pattern*.7});
    }else if(type===1){
      hazards.push({progress:cursor,lane:laneA,type:'crate',hit:false});
      hazards.push({progress:cursor+185,lane:laneB,type:'oil',hit:false});
    }else if(type===2){
      hazards.push({progress:cursor,lane:0,type:'cone',hit:false});
      hazards.push({progress:cursor,lane:2,type:'cone',hit:false});
      pickups.push({progress:cursor+85,lane:1,power:powers[pattern%powers.length],got:false,phase:pattern*.7});
    }else if(type===3){
      hazards.push({progress:cursor,lane:laneA,type:'barrier',hit:false});
      pickups.push({progress:cursor+25,lane:laneA,power:powers[pattern%powers.length],got:false,phase:pattern*.7});
      hazards.push({progress:cursor+210,lane:(laneA+2)%3,type:'crate',hit:false});
    }else{
      hazards.push({progress:cursor,lane:0,type:'oil',hit:false});
      hazards.push({progress:cursor+72,lane:1,type:'cone',hit:false});
      hazards.push({progress:cursor+144,lane:2,type:'crate',hit:false});
      pickups.push({progress:cursor+255,lane:(pattern+1)%3,power:powers[pattern%powers.length],got:false,phase:pattern*.7});
    }
    pattern++;
  }
}

function reset(){
  player.lane=1;player.x=.5;player.targetX=.5;player.progress=0;player.speed=137;player.baseSpeed=137;
  player.jumpY=0;player.jumpV=0;player.grounded=true;
  player.boost=0;player.shield=0;player.magnet=0;player.glow=0;player.hitFlash=0;
  roadTime=0;shake=0;currentZone=-1;collected=0;finished=false;playing=false;
  chemCount.textContent='⚗ 0';trackFill.style.width='0%';setPower('');
  buildTrack();
}

function roadGeom(y){
  var t=clamp((y-HORIZON)/(VH-HORIZON),0,1);
  var z=t*t;
  var half=lerp(29,218,z);
  var ahead=(1-t)*1760;
  var center=VW/2+roadCurveAt(player.progress+ahead)*lerp(.22,1,t);
  return {t:t,z:z,half:half,center:center};
}

function project(progress,laneIndex){
  var d=progress-player.progress;
  if(d<-100||d>1850)return null;
  var q=1-clamp(d/1850,0,1);
  var y=HORIZON+Math.pow(q,1.82)*(VH-HORIZON);
  var g=roadGeom(y);
  var lane=laneValue(laneIndex);
  return {
    x:g.center+(lane-.5)*g.half*1.64,
    y:y,
    scale:.20+g.z*1.02,
    z:g.z,
    half:g.half
  };
}

function moveLane(dir){
  if(!playing)return;
  var next=clamp(player.lane+dir,0,2);
  if(next===player.lane){sound(160,.04,'square',.015);return}
  player.lane=next;
  player.targetX=laneValue(next);
  sound(280,.045,'triangle',.018);
}

function jump(){
  if(!playing||!player.grounded)return;
  player.grounded=false;player.jumpV=540;
  sound(360,.06,'triangle',.024);vibrate(10);
}

function activate(power){
  collected++;chemCount.textContent='⚗ '+collected;
  if(power.kind==='boost'){player.boost=3.1;setPower('O · BOOST');showToast('Oxygen reaction · speed boost')}
  if(power.kind==='shield'){player.shield=5.4;setPower('C · SHIELD');showToast('Carbon reaction · shield active')}
  if(power.kind==='glow'){player.glow=4.2;setPower('Ne · GLOW');showToast('Neon reaction · road glow')}
  if(power.kind==='magnet'){player.magnet=4.5;setPower('Fe · MAGNET');showToast('Iron reaction · capsules pull toward you')}
  sound(620,.07,'sine',.034);
  setTimeout(function(){sound(810,.1,'sine',.028)},65);
  vibrate(18);
}

function collide(h){
  if(player.jumpY>34)return;

  if(player.shield>0){
    h.hit=true;player.shield=Math.max(0,player.shield-1.5);shake=.14;
    showToast('Carbon shield absorbed the hit');
    sound(300,.08,'triangle',.022);
    return;
  }

  h.hit=true;player.hitFlash=.5;player.speed=Math.max(92,player.speed-31);shake=.3;
  showToast('Bump! Keep moving');
  sound(115,.11,'sawtooth',.026);vibrate(32);
}

function update(dt){
  if(!playing)return;
  roadTime+=dt;

  player.x=lerp(player.x,player.targetX,1-Math.pow(.001,dt));

  if(!player.grounded){
    player.jumpY+=player.jumpV*dt;
    player.jumpV-=1120*dt;
    if(player.jumpY<=0){player.jumpY=0;player.jumpV=0;player.grounded=true;sound(180,.035,'triangle',.012)}
  }

  player.boost=Math.max(0,player.boost-dt);
  player.shield=Math.max(0,player.shield-dt);
  player.magnet=Math.max(0,player.magnet-dt);
  player.glow=Math.max(0,player.glow-dt);
  player.hitFlash=Math.max(0,player.hitFlash-dt);
  shake=Math.max(0,shake-dt);

  var targetSpeed=player.baseSpeed+(player.boost>0?45:0);
  player.speed=lerp(player.speed,targetSpeed,1-Math.pow(.055,dt));
  player.progress+=player.speed*dt;

  for(var i=0;i<pickups.length;i++){
    var p=pickups[i];if(p.got)continue;
    var diff=p.progress-player.progress;

    if(player.magnet>0&&diff<260&&diff>-30){
      var laneDiff=player.lane-p.lane;
      if(Math.abs(laneDiff)<=1&&Math.abs(diff)<220){
        p.lane=player.lane;
      }
    }

    if(Math.abs(diff)<58&&p.lane===player.lane){
      p.got=true;activate(p.power);burst(p.progress,p.lane,p.power.color,20);
    }
  }

  for(var j=0;j<hazards.length;j++){
    var h=hazards[j];if(h.hit)continue;
    var hd=h.progress-player.progress;
    if(Math.abs(hd)<46&&h.lane===player.lane)collide(h);
  }

  var zi=zoneIndex(player.progress);
  if(zi!==currentZone&&zi<4){currentZone=zi;showZone(zones[zi].name)}

  if(player.boost<=0&&player.shield<=0&&player.magnet<=0&&player.glow<=0)setPower('');

  updateParticles(dt);
  trackFill.style.width=clamp(player.progress/FINISH*100,0,100)+'%';
  if(player.progress>=FINISH)finish();
}

function burst(progress,lane,color,count){
  for(var i=0;i<count;i++){
    particles.push({
      progress:progress,
      lane:lane,
      dx:(Math.random()-.5)*30,
      dy:(Math.random()-.5)*18,
      vx:(Math.random()-.5)*58,
      vy:-25-Math.random()*75,
      age:0,
      life:.45+Math.random()*.55,
      color:color,
      size:2+Math.random()*3
    });
  }
}

function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];p.age+=dt;p.dx+=p.vx*dt;p.dy+=p.vy*dt;p.vy+=115*dt;
    if(p.age>=p.life)particles.splice(i,1);
  }
}

function finish(){
  if(finished)return;
  finished=true;playing=false;hud.classList.remove('show');controls.classList.remove('show');setPower('');
  resultCopy.textContent='You collected '+collected+' chemistry capsules and made it through the whole road.';
  sound(523,.12,'sine',.035);
  setTimeout(function(){sound(659,.14,'sine',.035)},100);
  setTimeout(function(){sound(784,.23,'sine',.035)},220);
  setTimeout(function(){endScreen.classList.remove('hidden')},620);
}

function rounded(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function shade(hex,amt){
  var n=parseInt(hex.slice(1),16),r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  return '#'+(0x1000000+(clamp(r,0,255)<<16)+(clamp(g,0,255)<<8)+clamp(b,0,255)).toString(16).slice(1);
}

function drawSky(z){
  var gr=ctx.createLinearGradient(0,0,0,VH);
  gr.addColorStop(0,z.sky1);gr.addColorStop(1,z.sky2);
  ctx.fillStyle=gr;ctx.fillRect(0,0,VW,VH);

  if(currentZone===3){
    for(var i=0;i<28;i++){
      var a=.3+.55*(.5+.5*Math.sin(roadTime*1.6+i));
      ctx.fillStyle='rgba(255,245,220,'+a+')';
      ctx.beginPath();ctx.arc((i*67)%VW,58+(i*103)%290,i%5===0?1.7:1,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='rgba(255,241,201,.9)';ctx.beginPath();ctx.arc(319,111,25,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='rgba(255,248,215,.68)';ctx.beginPath();ctx.arc(315,112,34,0,Math.PI*2);ctx.fill();
  }
}

function drawScenery(z){
  ctx.fillStyle=z.ground;ctx.fillRect(0,HORIZON,VW,VH-HORIZON);

  for(var band=0;band<4;band++){
    var by=204+band*38;
    ctx.fillStyle=currentZone===3?'rgba(25,30,52,'+(0.20+band*.08)+')':'rgba(62,96,80,'+(0.11+band*.05)+')';
    ctx.beginPath();ctx.moveTo(0,by+36);
    for(var x=0;x<=VW;x+=60)ctx.lineTo(x,by+Math.sin((x+roadTime*12+band*41)/58)*16);
    ctx.lineTo(VW,by+66);ctx.lineTo(0,by+66);ctx.closePath();ctx.fill();
  }
}

function drawRoad(z){
  var slices=58;
  for(var i=0;i<slices;i++){
    var y1=HORIZON+(VH-HORIZON)*i/slices;
    var y2=HORIZON+(VH-HORIZON)*(i+1)/slices;
    var g1=roadGeom(y1),g2=roadGeom(y2);

    ctx.fillStyle=(Math.floor((player.progress/72)+i/4)%2===0)?z.road:shade(z.road,-6);
    ctx.beginPath();ctx.moveTo(g1.center-g1.half,y1);ctx.lineTo(g1.center+g1.half,y1);ctx.lineTo(g2.center+g2.half,y2);ctx.lineTo(g2.center-g2.half,y2);ctx.closePath();ctx.fill();

    var ew1=lerp(2,16,g1.z),ew2=lerp(2,16,g2.z);
    var stripe=Math.floor((player.progress/42)+i/3)%2===0;
    ctx.fillStyle=stripe?z.edge:'#c96473';

    ctx.beginPath();ctx.moveTo(g1.center-g1.half-ew1,y1);ctx.lineTo(g1.center-g1.half,y1);ctx.lineTo(g2.center-g2.half,y2);ctx.lineTo(g2.center-g2.half-ew2,y2);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(g1.center+g1.half,y1);ctx.lineTo(g1.center+g1.half+ew1,y1);ctx.lineTo(g2.center+g2.half+ew2,y2);ctx.lineTo(g2.center+g2.half,y2);ctx.closePath();ctx.fill();

    if(i%3===0){
      ctx.strokeStyle='rgba(255,255,255,.52)';
      ctx.lineWidth=lerp(.45,3.6,g1.z);
      for(var lane=1;lane<=2;lane++){
        var lx1=g1.center-g1.half+g1.half*2*(lane/3);
        var lx2=g2.center-g2.half+g2.half*2*(lane/3);
        ctx.beginPath();ctx.moveTo(lx1,y1);ctx.lineTo(lx2,y2);ctx.stroke();
      }
    }
  }

  if(player.glow>0){
    ctx.save();ctx.globalCompositeOperation='screen';
    var glow=ctx.createRadialGradient(VW/2,620,20,VW/2,620,240);
    glow.addColorStop(0,'rgba(255,89,190,.17)');glow.addColorStop(1,'rgba(255,89,190,0)');
    ctx.fillStyle=glow;ctx.fillRect(0,270,VW,VH-270);ctx.restore();
  }
}

function drawCar(x,y,scale,jumpY){
  ctx.save();ctx.translate(x,y-jumpY);ctx.scale(scale,scale);

  var shadowScale=1-clamp(jumpY/220,0,.48);
  ctx.save();ctx.translate(0,jumpY);ctx.scale(shadowScale,shadowScale);
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,22,33,10,0,0,Math.PI*2);ctx.fill();ctx.restore();

  if(player.glow>0){ctx.shadowColor='#ff75c6';ctx.shadowBlur=26}
  if(player.boost>0){ctx.shadowColor='#ffd67d';ctx.shadowBlur=24}

  ctx.fillStyle='#242735';ctx.beginPath();ctx.arc(-24,15,9.5,0,Math.PI*2);ctx.arc(24,15,9.5,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  ctx.fillStyle='#e76f88';rounded(-35,-11,70,32,11);ctx.fill();
  ctx.fillStyle='#f4a2b2';rounded(-20,-27,42,21,10);ctx.fill();

  ctx.fillStyle='rgba(225,247,252,.82)';rounded(-12,-23,26,12,6);ctx.fill();

  ctx.fillStyle='#6e9f78';ctx.beginPath();ctx.arc(2,-30,12.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(-8,-28);ctx.lineTo(-19,-23);ctx.lineTo(-7,-20);ctx.closePath();ctx.fill();

  ctx.fillStyle='#f5f0da';ctx.beginPath();ctx.arc(7,-33,2.8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#252735';ctx.beginPath();ctx.arc(8,-33,1.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff0a8';ctx.fillRect(27,-3,8,5);

  if(player.shield>0){
    ctx.strokeStyle='rgba(135,224,235,.72)';ctx.lineWidth=2.8;
    ctx.beginPath();ctx.ellipse(0,-4,45,53,0,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

function drawPowerCapsule(p){
  if(p.got)return;
  var pr=project(p.progress,p.lane);if(!pr)return;

  var spin=Math.sin(roadTime*3.6+p.phase);
  var lift=10*pr.scale+Math.sin(roadTime*4+p.phase)*4*pr.scale;

  ctx.save();
  ctx.translate(pr.x,pr.y-lift);

  ctx.globalAlpha=.20+pr.z*.32;
  ctx.fillStyle='#10131c';
  ctx.beginPath();ctx.ellipse(0,12*pr.scale,17*pr.scale,5*pr.scale,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;

  ctx.scale(pr.scale,pr.scale);
  ctx.rotate(spin*.12);

  ctx.shadowColor=p.power.color;ctx.shadowBlur=18;
  var body=ctx.createLinearGradient(-18,-22,18,22);
  body.addColorStop(0,'#ffffff');
  body.addColorStop(.5,p.power.color);
  body.addColorStop(1,shade(p.power.color,-24));
  ctx.fillStyle=body;
  rounded(-17,-24,34,48,14);ctx.fill();
  ctx.shadowBlur=0;

  ctx.fillStyle='rgba(255,255,255,.34)';rounded(-10,-18,7,25,4);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.76)';ctx.lineWidth=1.5;rounded(-17,-24,34,48,14);ctx.stroke();

  ctx.fillStyle='#25283a';ctx.font='950 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(p.power.symbol,0,1);
  ctx.restore();
}

function drawHazard(h){
  if(h.hit)return;
  var pr=project(h.progress,h.lane);if(!pr)return;

  ctx.save();ctx.translate(pr.x,pr.y);ctx.scale(pr.scale,pr.scale);

  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.beginPath();ctx.ellipse(0,8,26,7,0,0,Math.PI*2);ctx.fill();

  if(h.type==='cone'){
    ctx.fillStyle='#ef814d';ctx.beginPath();ctx.moveTo(0,-30);ctx.lineTo(-15,8);ctx.lineTo(15,8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff4db';ctx.fillRect(-10,-8,20,6);ctx.fillStyle='#343744';ctx.fillRect(-19,7,38,7);
  }else if(h.type==='crate'){
    var gr=ctx.createLinearGradient(-20,-25,18,18);gr.addColorStop(0,'#c88d54');gr.addColorStop(1,'#855631');
    ctx.fillStyle=gr;rounded(-21,-31,42,40,4);ctx.fill();
    ctx.strokeStyle='#e0aa70';ctx.lineWidth=3;ctx.strokeRect(-17,-27,34,32);
    ctx.beginPath();ctx.moveTo(-15,-25);ctx.lineTo(15,3);ctx.moveTo(15,-25);ctx.lineTo(-15,3);ctx.stroke();
  }else if(h.type==='barrier'){
    ctx.fillStyle='#dcd7cc';rounded(-32,-25,64,13,4);ctx.fill();
    ctx.fillStyle='#e06c65';
    for(var i=-28;i<30;i+=18){ctx.save();ctx.translate(i,-19);ctx.rotate(-.55);ctx.fillRect(0,-6,8,17);ctx.restore()}
    ctx.fillStyle='#51545e';ctx.fillRect(-26,-13,6,22);ctx.fillRect(20,-13,6,22);
  }else{
    ctx.fillStyle='rgba(24,28,35,.84)';ctx.beginPath();ctx.ellipse(0,4,26,11,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.13)';ctx.beginPath();ctx.ellipse(-7,1,8,3,0,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}

function drawFinish(){
  var pr=project(FINISH,1);if(!pr)return;
  var g=roadGeom(pr.y),w=g.half*1.63;
  ctx.save();ctx.translate(pr.x,pr.y);ctx.scale(1,Math.max(.2,pr.scale));
  var cells=12,cell=w*2/cells;
  for(var i=0;i<cells;i++){
    ctx.fillStyle=i%2===0?'#ffffff':'#222532';
    ctx.fillRect(-w+i*cell,-6,cell,12);
  }
  ctx.restore();
}

function drawPlayer(){
  var y=714;
  var g=roadGeom(y);
  var x=g.center+(player.x-.5)*g.half*1.64;

  if(shake>0){x+=(Math.random()-.5)*10*shake/.3;y+=(Math.random()-.5)*7*shake/.3}

  if(player.boost>0&&player.grounded){
    ctx.strokeStyle='rgba(255,226,151,.65)';ctx.lineWidth=3;
    for(var i=0;i<6;i++){
      var ox=(Math.random()-.5)*50;ctx.beginPath();ctx.moveTo(x+ox,y+24);ctx.lineTo(x+ox,y+52+Math.random()*14);ctx.stroke();
    }
  }

  var alpha=player.hitFlash>0&&Math.floor(roadTime*18)%2===0?.45:1;
  ctx.globalAlpha=alpha;drawCar(x,y,1.06,player.jumpY);ctx.globalAlpha=1;
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i],pr=project(p.progress,p.lane);if(!pr)continue;
    var a=1-p.age/p.life;
    ctx.globalAlpha=a;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(pr.x+p.dx*pr.scale,pr.y-18*pr.scale+p.dy*pr.scale,p.size*pr.scale,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function draw(){
  ctx.setTransform(dpr*sx(),0,0,dpr*sy(),0,0);

  var zi=zoneIndex(player.progress),z=zones[Math.min(3,zi)];
  drawSky(z);drawScenery(z);drawRoad(z);drawFinish();

  var objs=[];
  for(var i=0;i<pickups.length;i++)objs.push({p:pickups[i].progress,t:'p',o:pickups[i]});
  for(var j=0;j<hazards.length;j++)objs.push({p:hazards[j].progress,t:'h',o:hazards[j]});
  objs.sort(function(a,b){return b.p-a.p});

  for(var k=0;k<objs.length;k++){
    if(objs[k].t==='p')drawPowerCapsule(objs[k].o);
    else drawHazard(objs[k].o);
  }

  drawPlayer();drawParticles();
}

function frame(t){
  var dt=Math.min(.032,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame);
}

function startGame(){
  reset();playing=true;
  startScreen.classList.add('hidden');endScreen.classList.add('hidden');
  hud.classList.add('show');controls.classList.add('show');
  showZone(zones[0].name);
  sound(330,.06,'square',.022);
  setTimeout(function(){sound(440,.06,'square',.022)},100);
  setTimeout(function(){sound(660,.1,'square',.028)},210);
}

function bindPress(id,fn){
  var el=document.getElementById(id);
  el.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();fn()});
}

bindPress('leftBtn',function(){moveLane(-1)});
bindPress('rightBtn',function(){moveLane(1)});
bindPress('jumpBtn',jump);

document.getElementById('startBtn').addEventListener('click',function(e){e.stopPropagation();startGame()});
document.getElementById('againBtn').addEventListener('click',function(e){e.stopPropagation();endScreen.classList.add('hidden');startGame()});
soundBtn.addEventListener('click',function(e){e.stopPropagation();muted=!muted;soundBtn.textContent=muted?'×':'♪'});
document.addEventListener('visibilitychange',function(){if(document.hidden)last=performance.now()});

reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
