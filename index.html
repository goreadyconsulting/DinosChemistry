<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#f7d8df" />
  <title>Dino's Chemistry</title>
  <style>
    :root{
      --ink:#2d2a34;
      --paper:#fff8f5;
      --rose:#ef8fa3;
      --rose-dark:#d86f89;
      --mint:#a9dcc9;
      --cream:#ffecc6;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#f4d8df;
      font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      touch-action:none;
      overscroll-behavior:none;
      -webkit-user-select:none;
      user-select:none;
    }
    body{
      display:grid;
      place-items:center;
      min-height:100dvh;
    }
    #app{
      position:relative;
      width:min(100vw,520px);
      height:100dvh;
      max-height:100dvh;
      overflow:hidden;
      background:#f8dfe4;
      isolation:isolate;
    }
    canvas{
      display:block;
      width:100%;
      height:100%;
      position:absolute;
      inset:0;
    }
    .hud{
      position:absolute;
      z-index:5;
      top:max(14px,env(safe-area-inset-top));
      left:16px;
      right:16px;
      display:flex;
      align-items:center;
      gap:10px;
      pointer-events:none;
      opacity:0;
      transform:translateY(-8px);
      transition:.3s ease;
    }
    .hud.show{opacity:1;transform:none}
    .chip{
      min-height:38px;
      display:flex;
      align-items:center;
      gap:7px;
      padding:0 12px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(255,255,255,.7);
      box-shadow:0 8px 24px rgba(72,45,57,.10);
      backdrop-filter:blur(12px);
      border-radius:999px;
      font-size:13px;
      font-weight:800;
      letter-spacing:.01em;
    }
    .progress-wrap{
      flex:1;
      height:9px;
      padding:2px;
      border-radius:999px;
      background:rgba(255,255,255,.7);
      box-shadow:0 6px 18px rgba(72,45,57,.08);
    }
    .progress{
      width:0%;
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#ef8fa3,#d86f89);
      transition:width .18s linear;
    }
    #mute{
      pointer-events:auto;
      border:0;
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border-radius:50%;
      font-size:16px;
      background:rgba(255,255,255,.78);
      box-shadow:0 8px 24px rgba(72,45,57,.10);
      backdrop-filter:blur(12px);
      color:var(--ink);
    }
    .screen{
      position:absolute;
      z-index:10;
      inset:0;
      display:grid;
      place-items:center;
      padding:28px;
      background:
        radial-gradient(circle at 50% 20%,rgba(255,255,255,.78),transparent 38%),
        linear-gradient(180deg,rgba(248,223,228,.76),rgba(255,244,238,.88));
      transition:opacity .45s ease,visibility .45s ease;
    }
    .screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .card{
      width:min(100%,380px);
      text-align:center;
      padding:30px 24px 24px;
      border-radius:32px;
      background:rgba(255,255,255,.75);
      border:1px solid rgba(255,255,255,.82);
      box-shadow:0 22px 70px rgba(99,56,69,.16);
      backdrop-filter:blur(18px);
    }
    .mini-dino{
      font-size:72px;
      line-height:1;
      filter:drop-shadow(0 9px 12px rgba(71,74,53,.16));
      transform:translateY(-2px);
    }
    h1{
      margin:18px 0 9px;
      font-size:clamp(31px,9vw,44px);
      line-height:1;
      letter-spacing:-.045em;
    }
    .subtitle{
      margin:0 auto;
      max-width:290px;
      font-size:15px;
      line-height:1.55;
      color:#69636e;
    }
    .formula{
      margin:18px auto 0;
      display:inline-flex;
      gap:7px;
      align-items:center;
      padding:8px 12px;
      border-radius:999px;
      background:#fff4f6;
      color:#b65770;
      font-size:12px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .primary{
      width:100%;
      border:0;
      margin-top:26px;
      padding:16px 20px;
      border-radius:18px;
      font:inherit;
      font-size:16px;
      font-weight:900;
      color:white;
      background:linear-gradient(180deg,#ef8fa3,#dc718b);
      box-shadow:0 12px 26px rgba(216,111,137,.28);
    }
    .hint{
      margin:12px 0 0;
      font-size:12px;
      color:#8d858f;
    }
    #toast{
      position:absolute;
      z-index:7;
      left:50%;
      bottom:calc(94px + env(safe-area-inset-bottom));
      transform:translate(-50%,14px);
      width:min(calc(100% - 42px),360px);
      padding:12px 16px;
      border-radius:16px;
      text-align:center;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(255,255,255,.92);
      box-shadow:0 12px 34px rgba(76,50,63,.14);
      backdrop-filter:blur(12px);
      opacity:0;
      transition:.32s ease;
      font-size:13px;
      line-height:1.35;
      font-weight:800;
      pointer-events:none;
    }
    #toast.show{opacity:1;transform:translate(-50%,0)}
    .tap-label{
      position:absolute;
      z-index:5;
      left:50%;
      bottom:calc(30px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      padding:10px 15px;
      border-radius:999px;
      background:rgba(255,255,255,.68);
      color:#6c6470;
      font-size:12px;
      font-weight:850;
      pointer-events:none;
      transition:.3s ease;
    }
    .tap-label.hide{opacity:0}
    .ending-line{
      margin:16px auto 0;
      max-width:310px;
      font-size:18px;
      line-height:1.45;
      font-weight:850;
    }
    .ending-small{
      margin:10px auto 0;
      max-width:300px;
      color:#766f79;
      font-size:13px;
      line-height:1.5;
    }
    @media (min-width:700px){
      #app{
        height:min(94dvh,900px);
        border-radius:36px;
        box-shadow:0 30px 80px rgba(75,42,56,.22);
      }
    }
  </style>
</head>
<body>
  <main id="app" aria-label="Dino's Chemistry game">
    <canvas id="game"></canvas>

    <div class="hud" id="hud">
      <div class="chip"><span>⚛</span><span id="atoms">0</span></div>
      <div class="progress-wrap"><div class="progress" id="progress"></div></div>
      <button id="mute" aria-label="Mute sound">♪</button>
    </div>

    <div id="toast"></div>
    <div class="tap-label" id="tapLabel">Tap anywhere to jump</div>

    <section class="screen" id="start">
      <div class="card">
        <div class="mini-dino">🦕</div>
        <div class="formula">A tiny experiment</div>
        <h1>Dino's<br>Chemistry</h1>
        <p class="subtitle">A little dino is looking for the one element that makes everything react differently.</p>
        <button class="primary" id="startBtn">Start the reaction</button>
        <p class="hint">Best played with sound on · Tap to jump</p>
      </div>
    </section>

    <section class="screen hidden" id="end">
      <div class="card">
        <div class="mini-dino">🦕♡🦕</div>
        <div class="formula">Reaction complete</div>
        <h1>Perfect<br>chemistry.</h1>
        <p class="ending-line">Turns out, the missing element was you.</p>
        <p class="ending-small" id="endStats"></p>
        <button class="primary" id="againBtn">One more reaction</button>
      </div>
    </section>
  </main>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('start');
  const endScreen = document.getElementById('end');
  const hud = document.getElementById('hud');
  const atomsEl = document.getElementById('atoms');
  const progressEl = document.getElementById('progress');
  const toast = document.getElementById('toast');
  const tapLabel = document.getElementById('tapLabel');
  const muteBtn = document.getElementById('mute');
  const endStats = document.getElementById('endStats');

  const W = 390;
  const H = 844;
  const GROUND = 676;
  const FINISH = 9800;

  let dpr = Math.min(devicePixelRatio || 1, 2);
  let running = false;
  let ended = false;
  let muted = false;
  let last = 0;
  let world = 0;
  let atoms = 0;
  let hits = 0;
  let speed = 124;
  let audioCtx = null;
  let toastTimer = null;

  const player = {
    x: 82,
    y: GROUND - 58,
    w: 55,
    h: 58,
    vy: 0,
    grounded: true,
    invuln: 0,
    squash: 0
  };

  const obstacles = [];
  const collectibles = [];
  const particles = [];

  const messages = [
    'H · Hydrogen — tiny, but it starts almost everything.',
    'C · Carbon — the backbone of something worth building.',
    'O · Oxygen — because the best things need room to breathe.',
    'N · Nitrogen — calm, steady, always around.',
    'Fe · Iron — a little strength for the road ahead.',
    'Au · Gold — rare things are worth finding.',
    'He · Helium — some people just make life feel lighter.',
    'Na · Sodium — chemistry gets interesting when things react.',
    'Ne · Neon — some people make the whole place glow.',
    'U · You — the element this experiment was missing.'
  ];

  function resize(){
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
  }
  addEventListener('resize', resize, {passive:true});
  resize();

  function sx(){ return canvas.width / dpr / W; }
  function sy(){ return canvas.height / dpr / H; }

  function sound(freq=520, duration=.06, type='sine', volume=.035){
    if(muted) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(volume, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + duration);
      o.connect(g).connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + duration);
    }catch(e){}
  }

  function vibrate(ms){
    if(navigator.vibrate) navigator.vibrate(ms);
  }

  function makeWorld(){
    obstacles.length = 0;
    collectibles.length = 0;
    particles.length = 0;

    let x = 720;
    let seed = 9;
    const rand = () => {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };

    while(x < FINISH - 560){
      const gap = 420 + rand() * 330;
      x += gap;
      const type = rand() > .48 ? 'rock' : 'cactus';
      obstacles.push({
        x,
        type,
        w: type === 'rock' ? 42 : 34,
        h: type === 'rock' ? 32 : 54,
        hit:false
      });
      if(rand() > .35){
        obstacles.push({
          x:x + 110 + rand()*85,
          type:'rock',
          w:36,
          h:27,
          hit:false
        });
      }
    }

    const labels = ['H','C','O','N','Fe','Au','He','Na','Ne','U'];
    labels.forEach((label, i) => {
      collectibles.push({
        x: 700 + i * ((FINISH - 1400) / (labels.length - 1)),
        y: 510 - (i % 3) * 42,
        r: 22,
        label,
        got:false,
        index:i
      });
    });
  }

  function reset(){
    world = 0;
    atoms = 0;
    hits = 0;
    speed = 124;
    ended = false;
    running = false;
    player.y = GROUND - player.h;
    player.vy = 0;
    player.grounded = true;
    player.invuln = 0;
    player.squash = 0;
    atomsEl.textContent = '0';
    progressEl.style.width = '0%';
    makeWorld();
  }

  function startGame(){
    reset();
    running = true;
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    hud.classList.add('show');
    tapLabel.classList.remove('hide');
    sound(420,.08);
    setTimeout(() => tapLabel.classList.add('hide'), 2600);
  }

  function jump(){
    if(!running || ended) return;
    if(player.grounded){
      player.vy = -650;
      player.grounded = false;
      player.squash = .12;
      sound(390,.05,'triangle',.025);
    }
  }

  function showToast(text){
    clearTimeout(toastTimer);
    toast.textContent = text;
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2450);
  }

  function finish(){
    if(ended) return;
    ended = true;
    running = false;
    hud.classList.remove('show');
    tapLabel.classList.add('hide');
    sound(523,.12,'sine',.04);
    setTimeout(() => sound(659,.14,'sine',.04),100);
    setTimeout(() => sound(784,.24,'sine',.04),220);
    endStats.textContent = atoms === 10
      ? 'You found every element along the way. Some reactions are worth completing.'
      : `You found ${atoms} of 10 elements. The important one was waiting at the end anyway.`;
    setTimeout(() => endScreen.classList.remove('hidden'), 650);
  }

  function scene(){
    const p = world / FINISH;
    if(p < .25) return 0;
    if(p < .5) return 1;
    if(p < .75) return 2;
    return 3;
  }

  function skyGradient(s){
    const g = ctx.createLinearGradient(0,0,0,H);
    if(s===0){ g.addColorStop(0,'#f7d8df'); g.addColorStop(1,'#fff2d7'); }
    if(s===1){ g.addColorStop(0,'#cfe5e0'); g.addColorStop(1,'#f7e7c7'); }
    if(s===2){ g.addColorStop(0,'#f6b89d'); g.addColorStop(.55,'#e8a8b6'); g.addColorStop(1,'#f6d4ae'); }
    if(s===3){ g.addColorStop(0,'#2f395f'); g.addColorStop(.62,'#70506f'); g.addColorStop(1,'#d28b86'); }
    return g;
  }

  function roundRect(x,y,w,h,r){
    const rr = Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  function drawBackground(){
    const s = scene();
    ctx.fillStyle = skyGradient(s);
    ctx.fillRect(0,0,W,H);

    const p = world / FINISH;

    if(s===3){
      ctx.globalAlpha=.85;
      for(let i=0;i<30;i++){
        const x=(i*71 + 23)%W;
        const y=70 + (i*113)%330;
        const tw=.55 + Math.sin(performance.now()/550 + i)*.25;
        ctx.fillStyle=`rgba(255,246,220,${tw})`;
        ctx.beginPath();ctx.arc(x,y,i%4===0?1.8:1.1,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.fillStyle='#fff4d6';
      ctx.beginPath();ctx.arc(318,118,31,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#3d4267';
      ctx.beginPath();ctx.arc(330,107,31,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle=s===2?'#ffd6a2':'rgba(255,255,238,.74)';
      ctx.beginPath();ctx.arc(315,125,42,0,Math.PI*2);ctx.fill();
    }

    const cloudShift = (world*.05)%520;
    ctx.fillStyle = s===3 ? 'rgba(255,238,230,.09)' : 'rgba(255,255,255,.42)';
    for(let i=-1;i<3;i++){
      const cx=i*210-cloudShift+70;
      const cy=165+(i%2)*74;
      ctx.beginPath();
      ctx.arc(cx,cy,28,0,Math.PI*2);
      ctx.arc(cx+31,cy-8,37,0,Math.PI*2);
      ctx.arc(cx+68,cy+1,25,0,Math.PI*2);
      ctx.fill();
    }

    const backY = 505;
    const off1=(world*.11)%260;
    ctx.fillStyle=s===3?'#3f4767':s===2?'#bc7284':'#94b9a8';
    for(let i=-1;i<4;i++){
      const x=i*210-off1;
      ctx.beginPath();
      ctx.moveTo(x,backY);
      ctx.lineTo(x+95,350+(i%2)*38);
      ctx.lineTo(x+210,backY);
      ctx.closePath();ctx.fill();
    }

    const off2=(world*.2)%210;
    ctx.fillStyle=s===3?'#4c536b':s===2?'#c78683':'#7da68b';
    for(let i=-1;i<4;i++){
      const x=i*180-off2;
      ctx.beginPath();
      ctx.moveTo(x,GROUND+5);
      ctx.quadraticCurveTo(x+70,490,x+180,GROUND+5);
      ctx.closePath();ctx.fill();
    }

    ctx.fillStyle=s===3?'#515668':s===2?'#bc8b75':'#87ac84';
    ctx.fillRect(0,GROUND,W,H-GROUND);

    ctx.fillStyle=s===3?'#71736f':s===2?'#d7a27e':'#a9ca93';
    ctx.fillRect(0,GROUND,W,10);

    const grassOff=(world*.62)%28;
    ctx.fillStyle=s===3?'rgba(220,220,190,.42)':'rgba(75,119,73,.55)';
    for(let x=-10;x<W+20;x+=28){
      const gx=x-grassOff;
      ctx.fillRect(gx,GROUND-7,2,7);
      ctx.fillRect(gx+5,GROUND-4,2,4);
    }

    if(p>.72){
      ctx.fillStyle='rgba(255,224,156,.72)';
      for(let i=0;i<10;i++){
        const x=(i*43 + (performance.now()/40)*(i%2?1:-1))%W;
        const xx=(x+W)%W;
        const y=460+(i*31)%180;
        ctx.beginPath();ctx.arc(xx,y,2.1,0,Math.PI*2);ctx.fill();
      }
    }
  }

  function drawDino(x,y,alpha=1,flipped=false){
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(x+(flipped?50:0),y);
    if(flipped) ctx.scale(-1,1);

    const bob = running && player.grounded ? Math.sin(performance.now()/85)*1.8 : 0;
    ctx.translate(0,bob);

    ctx.fillStyle='#6e9f78';
    roundRect(16,14,35,31,13);ctx.fill();
    roundRect(7,31,36,25,10);ctx.fill();

    ctx.beginPath();
    ctx.moveTo(9,40);ctx.lineTo(-10,50);ctx.lineTo(9,51);ctx.closePath();ctx.fill();

    ctx.fillStyle='#6e9f78';
    roundRect(31,3,24,26,9);ctx.fill();

    ctx.fillStyle='#f7f0d8';
    ctx.beginPath();ctx.arc(47,12,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#2d2a34';
    ctx.beginPath();ctx.arc(48,12,1.7,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='#628f6c';
    ctx.fillRect(13,52,9,9);
    ctx.fillRect(34,52,9,9);

    ctx.fillStyle='#e8899e';
    ctx.beginPath();ctx.arc(49,22,3.2,0,Math.PI*2);ctx.fill();

    ctx.restore();
  }

  function drawObstacle(o){
    const x=o.x-world+player.x;
    if(x<-80 || x>W+80) return;
    if(o.type==='rock'){
      ctx.fillStyle='#7e7777';
      ctx.beginPath();
      ctx.moveTo(x,GROUND);
      ctx.quadraticCurveTo(x+5,GROUND-o.h+3,x+18,GROUND-o.h);
      ctx.quadraticCurveTo(x+o.w-3,GROUND-o.h+4,x+o.w,GROUND);
      ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.18)';
      ctx.beginPath();ctx.arc(x+17,GROUND-o.h+10,6,0,Math.PI*2);ctx.fill();
    }else{
      ctx.fillStyle='#527f66';
      roundRect(x+10,GROUND-o.h,16,o.h,7);ctx.fill();
      roundRect(x,GROUND-o.h+18,12,8,5);ctx.fill();
      roundRect(x+23,GROUND-o.h+28,11,8,5);ctx.fill();
      ctx.fillRect(x+8,GROUND-o.h+22,5,12);
      ctx.fillRect(x+22,GROUND-o.h+29,5,14);
    }
  }

  function drawCollectible(c){
    if(c.got) return;
    const x=c.x-world+player.x;
    if(x<-70 || x>W+70) return;
    const floatY=c.y+Math.sin(performance.now()/320+c.index)*8;

    ctx.save();
    ctx.translate(x,floatY);
    ctx.shadowColor='rgba(255,255,255,.75)';
    ctx.shadowBlur=18;
    ctx.fillStyle='rgba(255,255,255,.92)';
    ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(216,111,137,.55)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.ellipse(0,0,c.r+8,8,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0,0,c.r+8,8,Math.PI/3,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#c85e78';
    ctx.font='800 14px ui-rounded,system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c.label,0,.5);
    ctx.restore();
  }

  function addParticles(x,y,count=9){
    for(let i=0;i<count;i++){
      particles.push({
        x,y,
        vx:(Math.random()-.5)*110,
        vy:-40-Math.random()*120,
        life:.65+Math.random()*.3,
        age:0,
        size:2+Math.random()*3
      });
    }
  }

  function update(dt){
    if(!running) return;

    speed = Math.min(170, 124 + world/480);
    world += speed * dt;
    progressEl.style.width = Math.min(100,world/FINISH*100)+'%';

    player.vy += 1780*dt;
    player.y += player.vy*dt;
    if(player.y >= GROUND-player.h){
      player.y=GROUND-player.h;
      player.vy=0;
      player.grounded=true;
    }
    player.invuln=Math.max(0,player.invuln-dt);
    player.squash=Math.max(0,player.squash-dt);

    for(const o of obstacles){
      if(o.hit) continue;
      const ox=o.x-world+player.x;
      const oy=GROUND-o.h;
      const px=player.x+7, py=player.y+8, pw=player.w-14, ph=player.h-9;
      if(px < ox+o.w && px+pw > ox && py < oy+o.h && py+ph > oy){
        o.hit=true;
        hits++;
        player.invuln=.8;
        player.vy=-250;
        player.grounded=false;
        vibrate(35);
        sound(125,.1,'sawtooth',.025);
        showToast('Tiny reaction error. Keep going ♡');
      }
    }

    for(const c of collectibles){
      if(c.got) continue;
      const cx=c.x-world+player.x;
      const cy=c.y+Math.sin(performance.now()/320+c.index)*8;
      const dx=(player.x+player.w/2)-cx;
      const dy=(player.y+player.h/2)-cy;
      if(dx*dx+dy*dy < 42*42){
        c.got=true;
        atoms++;
        atomsEl.textContent=atoms;
        addParticles(cx,cy,12);
        vibrate(18);
        sound(600+c.index*34,.08,'sine',.03);
        showToast(messages[c.index]);
      }
    }

    for(const p of particles){
      p.age+=dt;
      p.x+=p.vx*dt;
      p.y+=p.vy*dt;
      p.vy+=220*dt;
    }
    for(let i=particles.length-1;i>=0;i--){
      if(particles[i].age>=particles[i].life) particles.splice(i,1);
    }

    if(world>=FINISH) finish();
  }

  function drawParticles(){
    for(const p of particles){
      const a=1-p.age/p.life;
      ctx.globalAlpha=a;
      ctx.fillStyle='#fff4d8';
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function draw(){
    const scaleX=sx(), scaleY=sy();
    ctx.setTransform(dpr*scaleX,0,0,dpr*scaleY,0,0);
    drawBackground();

    for(const c of collectibles) drawCollectible(c);
    for(const o of obstacles) drawObstacle(o);

    const blink=player.invuln>0 && Math.floor(performance.now()/90)%2===0;
    if(!blink) drawDino(player.x,player.y);

    drawParticles();

    if(world>FINISH-520 && !ended){
      const otherX = W - 92 - Math.max(0,(FINISH-world)*.12);
      drawDino(otherX,GROUND-58,1,true);
      ctx.fillStyle='rgba(255,244,246,.92)';
      ctx.beginPath();
      ctx.moveTo(otherX+24,GROUND-88);
      ctx.bezierCurveTo(otherX+8,GROUND-103,otherX-8,GROUND-82,otherX+24,GROUND-62);
      ctx.bezierCurveTo(otherX+56,GROUND-82,otherX+40,GROUND-103,otherX+24,GROUND-88);
      ctx.fill();
    }
  }

  function loop(t){
    const dt=Math.min(.032,(t-last)/1000 || 0);
    last=t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  document.getElementById('startBtn').addEventListener('click', e => {
    e.stopPropagation();
    startGame();
  });
  document.getElementById('againBtn').addEventListener('click', e => {
    e.stopPropagation();
    endScreen.classList.add('hidden');
    startGame();
  });

  canvas.addEventListener('pointerdown', jump);
  document.getElementById('app').addEventListener('pointerdown', e => {
    if(e.target.tagName !== 'BUTTON' && running) jump();
  });

  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    muted=!muted;
    muteBtn.textContent=muted?'×':'♪';
  });

  document.addEventListener('visibilitychange', () => {
    if(document.hidden) last=performance.now();
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
